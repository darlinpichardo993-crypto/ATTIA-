name: Build ATTIA

on:
  push:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tools/**'
      - 'installer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bank generator dependency
        run: python -m pip install --upgrade pip numpy

      - name: Generate waveform bank
        run: python tools/gen_bank.py installer/payload/attia_bank.bin

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --target ATTIA_VST3 ATTIA_Standalone --parallel

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer/ATTIA.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist/setup.exe")) { throw "setup.exe was not generated" }

      - name: Upload installer and plugin
        uses: actions/upload-artifact@v4
        with:
          name: ATTIA-Windows-Build
          path: |
            dist/setup.exe
            build/ATTIA_artefacts/Release/VST3/ATTIA.vst3/**
            build/ATTIA_artefacts/Release/Standalone/ATTIA.exe
          if-no-files-found: error
          retention-days: 14
